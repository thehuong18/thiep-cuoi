<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Save The Date - Đăng Phong & Thế Trang</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
    <button id="music-btn" class="music-btn" title="Bật/Tắt nhạc">🔇</button>
</head>
<body class="cover-page">

    <div class="bg-pattern"></div>

    <div class="cover-container">
        <div class="envelope-wrapper">
            
            <div class="envelope-body">
                <div class="photo-frame">
                    <img src="images/anh-bia.png" alt="Đăng Phong & Thế Trang">
                </div>
            </div>
            
            <div class="envelope-info">
                <p class="save-date">Save the date</p>
                <h1 class="cover-names">ĐĂNG PHONG & THẾ TRANG</h1>
                <div class="cover-dates">
                    <span>23.10.2026</span>
                </div>
                <a href="main.html" class="btn-open" id="btnOpen">💌 Mở Thiệp</a>
            </div>
        </div>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-btn');
        let isPlaying = false;

        document.body.addEventListener('click', () => {
            if (!isPlaying) {
                music.play().then(() => {
                    isPlaying = true;
                    musicBtn.textContent = '🔊';
                }).catch(e => console.log('Autoplay blocked'));
            }
        }, { once: true });

        musicBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (isPlaying) {
                music.pause();
                musicBtn.textContent = '🔇';
            } else {
                music.play();
                musicBtn.textContent = '🔊';
            }
            isPlaying = !isPlaying;
        });

        document.getElementById('btnOpen').addEventListener('click', function(e) {
            e.preventDefault();
            document.body.classList.add('fade-out');
            setTimeout(() => {
                window.location.href = 'main.html';
            }, 800);
        });
    </script>
</body>
</html>
